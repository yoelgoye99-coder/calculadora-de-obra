<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculadora de Obra</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="app">

    <header class="header">
      <h1>Calculadora de Obra</h1>
      <p>Materiales y costos, claros desde el primer cálculo</p>
    </header>

    <section class="menu">

      <button class="menu-card" onclick="goTo('materiales')">
        <div class="icon">🧱</div>
        <div class="text">
          <h2>Cantidad de materiales</h2>
          <span>Cálculo por m², m³ o bolsas</span>
        </div>
      </button>

      <button class="menu-card" onclick="goTo('mano-obra')">
        <div class="icon">👷</div>
        <div class="text">
          <h2>Presupuesto de mano de obra</h2>
          <span>Costo final del trabajo</span>
        </div>
      </button>

      <button class="menu-card" onclick="goTo('precio-materiales')">
        <div class="icon">💰</div>
        <div class="text">
          <h2>Precio de materiales</h2>
          <span>Valores editables por unidad</span>
        </div>
      </button>

      <button class="menu-card" onclick="goTo('mis-precios')">
        <div class="icon">⚙️</div>
        <div class="text">
          <h2>Mis precios</h2>
          <span>Mano de obra y adicionales</span>
        </div>
      </button>

    </section>

    <footer class="footer">
      Versión 0.1
    </footer>

  </main>

  <script src="app.js"></script>
</body>
</html>      </section>

      <section class="screen" id="precios-materiales" data-title="Precio de materiales">
        <h2 class="h2">Precio de materiales</h2>
        <p class="muted">Pendiente.</p>
      </section>

      <section class="screen" id="mis-precios" data-title="Mis precios">
        <h2 class="h2">Mis precios</h2>
        <p class="muted">Pendiente.</p>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
